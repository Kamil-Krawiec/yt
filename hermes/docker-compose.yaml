services:
  hermes:
    # Aktualizuj ten tag świadomie — nie używaj latest.
    image: nousresearch/hermes-agent:v2026.9.14
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]

    # Dostęp tylko z hosta. Zdalnie użyj tunelu SSH lub VPN.
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"

    volumes:
      - ${HOME}/.hermes:/opt/data

    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_UID: ${HERMES_UID:?Ustaw HERMES_UID poleceniem export HERMES_UID="$(id -u)"}
      HERMES_GID: ${HERMES_GID:?Ustaw HERMES_GID poleceniem export HERMES_GID="$(id -g)"}

    security_opt:
      - no-new-privileges:true

    pids_limit: 256
    mem_limit: 4g
    cpus: "2.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
